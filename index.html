<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English Fun: ¡Los Objetos!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Fredoka",ui-rounded,"Comic Sans MS","Trebuchet MS",sans-serif;background:#7f5af0;background:linear-gradient(135deg,#7f5af0,#2cb1ff 55%,#2ee6a6);background-attachment:fixed;color:#2b2150;min-height:100vh;overflow-x:hidden}
.fl{position:fixed;left:0;font-size:2rem;opacity:.35;pointer-events:none;animation:fl linear infinite}
@keyframes fl{from{transform:translateY(105vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}
.wrap{position:relative;max-width:760px;margin:0 auto;padding:14px}
h1{margin:6px 0 2px;text-align:center;color:#fff;font-size:clamp(1.8rem,7vw,2.8rem);text-shadow:0 4px 0 rgba(0,0,0,.18)}
h1 span{display:inline-block;animation:bn 1.4s ease-in-out infinite}
h1 span:nth-child(2){animation-delay:.2s}h1 span:nth-child(3){animation-delay:.4s}
@keyframes bn{50%{transform:translateY(-8px) rotate(-4deg)}}
.sub{text-align:center;color:#fff;margin:0 0 12px;font-weight:600}
.tabs,.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
button{font-family:inherit;cursor:pointer;border:0}
.tab{background:#fff;color:#2b2150;padding:10px 16px;border-radius:999px;font-size:1.05rem;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .15s}
.tab:active{transform:translateY(3px)}
.tab.on{background:#ffd23f;transform:scale(1.07)}
.chip{padding:8px 12px;border-radius:14px;font-weight:700;font-size:.95rem;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25);opacity:.8;transition:transform .15s}
.chip.on{opacity:1;transform:scale(1.1);outline:3px solid #fff}
.panel{background:rgba(255,255,255,.93);border-radius:26px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:pop .4s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.help{text-align:center;font-weight:600;margin:0 0 12px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.lc{border-radius:20px;padding:12px 6px;text-align:center;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .15s}
.lc:hover{transform:translateY(-3px) rotate(-1deg)}
.lc .em{font-size:3rem;display:block}
.lc b{display:block;font-size:1.3rem}
.lc i{font-style:normal;opacity:.95;font-size:.95rem}
.bounce{animation:jump .6s}
@keyframes jump{30%{transform:scale(1.2) rotate(-6deg)}60%{transform:scale(.95) rotate(4deg)}}
.big{display:block;margin:6px auto 14px;font-size:1.3rem;font-weight:700;background:#ff6b6b;color:#fff;padding:14px 26px;border-radius:999px;box-shadow:0 5px 0 #b83b3b}
.bigem{text-align:center;font-size:5rem;animation:bn 1.6s infinite}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.op{background:#fff;border:4px solid #7f5af0;border-radius:20px;padding:12px;font-size:3rem;font-weight:700;color:#2b2150;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.op.t{font-size:1.5rem}
.op.bad{background:#ffe0e0;border-color:#ff6b6b;opacity:.5;animation:sh .4s}
.op.good{background:#d4ffe6;border-color:#1fbf75;animation:jump .6s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.bar{height:14px;background:#e6e0ff;border-radius:99px;overflow:hidden;margin-bottom:12px}
.bar div{height:100%;background:linear-gradient(90deg,#ffd23f,#ff6b6b);transition:width .4s}
.msg{min-height:1.6em;text-align:center;font-weight:700;font-size:1.15rem;margin-top:12px}
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;perspective:600px;cursor:pointer}
.in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.mc.on .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.f{background:linear-gradient(135deg,#ff6b6b,#ffd23f);font-size:clamp(1.5rem,7vw,2.6rem);color:#fff}
.b{background:#fff;transform:rotateY(180deg);font-size:clamp(1.8rem,9vw,3.2rem);border:3px solid #7f5af0}
.b.w{font-size:clamp(.8rem,3.6vw,1.4rem);font-weight:700;color:#2b2150;padding:2px;word-break:break-word}
.mc.ok .b{background:#d4ffe6;border-color:#1fbf75}
.mc.ok .in{animation:jump .6s}
.cf{position:fixed;top:-2rem;font-size:1.8rem;z-index:9;pointer-events:none;animation:cf linear forwards}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
.stars{font-size:3rem;text-align:center}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style></head>
<body>
<div id="bg"></div>
<div class="wrap">
<h1><span>English</span> <span>Fun</span> <span>🎈</span></h1>
<p class="sub">¡Aprende los objetos en inglés jugando!</p>
<div class="tabs" id="tabs"></div>
<div class="chips" id="chips"></div>
<div class="panel" id="app"></div>
</div>
<script>
var C=[
{n:"Escuela",e:"🎒",c:"#ff6b6b",w:[["book","libro","📖"],["pencil","lápiz","✏️"],["backpack","mochila","🎒"],["scissors","tijeras","✂️"],["ruler","regla","📏"],["pen","bolígrafo","🖊️"],["notebook","cuaderno","📓"],["globe","globo terráqueo","🌎"]]},
{n:"Casa",e:"🏠",c:"#2cb1ff",w:[["bed","cama","🛏️"],["chair","silla","🪑"],["door","puerta","🚪"],["window","ventana","🪟"],["sofa","sofá","🛋️"],["key","llave","🔑"],["mirror","espejo","🪞"],["TV","televisión","📺"]]},
{n:"Ropa",e:"👕",c:"#9b5de5",w:[["shirt","camiseta","👕"],["pants","pantalones","👖"],["dress","vestido","👗"],["shoes","zapatos","👟"],["socks","calcetines","🧦"],["hat","gorra","🧢"],["jacket","chaqueta","🧥"],["gloves","guantes","🧤"]]},
{n:"Juguetes",e:"🧸",c:"#f29e1f",w:[["ball","pelota","⚽"],["teddy bear","osito de peluche","🧸"],["kite","cometa","🪁"],["robot","robot","🤖"],["puzzle","rompecabezas","🧩"],["car","carro","🚗"],["drum","tambor","🥁"],["balloon","globo","🎈"]]},
{n:"Cocina",e:"🍽️",c:"#1fbf75",w:[["cup","taza","☕"],["spoon","cuchara","🥄"],["fork","tenedor","🍴"],["plate","plato","🍽️"],["bowl","tazón","🥣"],["glass","vaso","🥛"],["salt","sal","🧂"],["teapot","tetera","🫖"]]}
];
var tab="lesson",cat=0;
var TABS=[["lesson","📚 Lección"],["quiz","🎯 Quiz"],["mem","🧠 Memoria"]];

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function say(t){
  try{
    if(!("speechSynthesis" in window))return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang="en-US";u.rate=0.8;u.pitch=1.1;
    var vs=speechSynthesis.getVoices();
    for(var i=0;i<vs.length;i++){if(vs[i].lang&&vs[i].lang.replace("_","-")==="en-US"){u.voice=vs[i];break;}}
    speechSynthesis.speak(u);
  }catch(e){}
}
if("speechSynthesis" in window){try{speechSynthesis.getVoices();}catch(e){}}
function burst(){
  var em=["🎉","⭐","✨","🎈","🌟"];
  for(var i=0;i<18;i++){
    var s=document.createElement("span");
    s.className="cf";s.textContent=em[i%em.length];
    s.style.left=(Math.random()*95)+"vw";
    s.style.animationDuration=(1.2+Math.random()*1.3)+"s";
    document.body.appendChild(s);
    (function(x){setTimeout(function(){x.remove();},2800);})(s);
  }
}
(function(){
  var bg=document.getElementById("bg"),all=["⭐","🎈","✏️","🧸","🎒","☁️","🌈","🪁"];
  for(var i=0;i<8;i++){
    var s=document.createElement("span");s.className="fl";s.textContent=all[i];
    s.style.left=(5+i*12)+"vw";s.style.animationDuration=(12+i*2)+"s";s.style.animationDelay=(-i*2)+"s";
    bg.appendChild(s);
  }
})();

function render(){
  var t="";
  TABS.forEach(function(x){t+='<button class="tab'+(tab===x[0]?" on":"")+'" onclick="setTab(\''+x[0]+'\')">'+x[1]+'</button>';});
  document.getElementById("tabs").innerHTML=t;
  var ch="";
  if(tab!=="quiz"){
    C.forEach(function(c,i){ch+='<button class="chip'+(cat===i?" on":"")+'" style="background:'+c.c+'" onclick="setCat('+i+')">'+c.e+" "+c.n+"</button>";});
  }
  document.getElementById("chips").innerHTML=ch;
  if(tab==="lesson")lesson();else if(tab==="quiz")startQuiz();else startMem();
}
function setTab(t){tab=t;render();}
function setCat(i){cat=i;render();}
var app=document.getElementById("app");

/* LECCIÓN */
function lesson(){
  var c=C[cat];
  var h='<p class="help">👆 ¡Toca cada tarjeta para escuchar la palabra en inglés! 🔊</p><div class="grid">';
  c.w.forEach(function(w,i){
    h+='<button class="lc" id="lc'+i+'" style="background:'+c.c+'" onclick="hear('+i+')"><span class="em">'+w[2]+'</span><b>'+w[0]+'</b><i>'+w[1]+'</i></button>';
  });
  app.innerHTML=h+"</div>";
}
function hear(i){
  var el=document.getElementById("lc"+i);
  el.classList.remove("bounce");void el.offsetWidth;el.classList.add("bounce");
  say(C[cat].w[i][0]);
}

/* QUIZ */
var Q=[],qi=0,score=0,tries=0,locked=false,opts=[];
function startQuiz(){
  var flat=[];
  C.forEach(function(c){c.w.forEach(function(w){flat.push(w);});});
  Q=shuffle(flat).slice(0,10).map(function(w,i){return{w:w,type:i%2};});
  Q.flat=flat;qi=0;score=0;showQ();
}
function showQ(){
  if(qi>=Q.length)return endQ();
  var q=Q[qi];tries=0;locked=false;
  var d=shuffle(Q.flat.filter(function(w){return w[0]!==q.w[0];})).slice(0,3);
  opts=shuffle(d.concat([q.w]));
  var h='<div class="bar"><div style="width:'+(qi/Q.length*100)+'%"></div></div>';
  h+='<p class="help">Pregunta '+(qi+1)+' de '+Q.length+'</p>';
  if(q.type===0){
    h+='<p class="help">👂 Escucha la palabra y toca el dibujo correcto</p><button class="big" onclick="say(Q[qi].w[0])">🔊 Escuchar</button><div class="opts">';
    opts.forEach(function(o,j){h+='<button class="op" onclick="ans(this,'+j+')">'+o[2]+'</button>';});
  }else{
    h+='<p class="help">🤔 ¿Cómo se dice esto en inglés?</p><div class="bigem">'+q.w[2]+'</div><div class="opts">';
    opts.forEach(function(o,j){h+='<button class="op t" onclick="ans(this,'+j+')">'+o[0]+'</button>';});
  }
  app.innerHTML=h+'</div><div class="msg" id="msg"></div>';
  if(q.type===0)setTimeout(function(){say(q.w[0]);},400);
}
function ans(b,j){
  if(locked||b.classList.contains("bad"))return;
  var q=Q[qi],m=document.getElementById("msg");
  if(opts[j][0]===q.w[0]){
    locked=true;if(tries===0)score++;
    b.classList.add("good");burst();say(q.w[0]);
    m.textContent=["¡Muy bien! 🎉","¡Genial! ⭐","¡Excelente! 🌟"][qi%3];
    setTimeout(function(){qi++;showQ();},1700);
  }else{
    tries++;b.classList.add("bad");
    m.textContent="¡Casi! Inténtalo otra vez 💪";
  }
}
function endQ(){
  var p=score/Q.length,s=p>=.8?3:p>=.5?2:1,st="";
  for(var i=0;i<3;i++)st+=i<s?"⭐":"☆";
  burst();
  app.innerHTML='<div class="bigem">🏆</div><div class="stars">'+st+'</div><p class="help" style="font-size:1.4rem">¡Terminaste el quiz!<br>Acertaste '+score+' de '+Q.length+' a la primera.</p><button class="big" onclick="startQuiz()">🔄 Jugar otra vez</button>';
}

/* MEMORIA */
var deck=[],fl=[],done=0,moves=0,lockM=false;
function startMem(){
  var c=C[cat];deck=[];fl=[];done=0;moves=0;lockM=false;
  c.w.forEach(function(w,i){deck.push({k:i,t:"e"});deck.push({k:i,t:"w"});});
  deck=shuffle(deck);
  var h='<p class="help">🧠 Une cada dibujo con su palabra en inglés. ¡Toca las tarjetas!</p><p class="help" id="mv">Intentos: 0</p><div class="mg">';
  deck.forEach(function(d,i){
    var w=c.w[d.k];
    h+='<div class="mc" id="m'+i+'" onclick="flip('+i+')"><div class="in"><div class="f">❓</div><div class="b'+(d.t==="w"?" w":"")+'">'+(d.t==="e"?w[2]:w[0])+'</div></div></div>';
  });
  app.innerHTML=h+'</div><div class="msg" id="msg"></div><button class="big" style="margin-top:14px" onclick="startMem()">🔄 Reiniciar</button>';
}
function flip(i){
  var el=document.getElementById("m"+i);
  if(lockM||fl.indexOf(i)>-1||el.classList.contains("ok"))return;
  el.classList.add("on");fl.push(i);
  if(deck[i].t==="w")say(C[cat].w[deck[i].k][0]);
  if(fl.length===2){
    moves++;document.getElementById("mv").textContent="Intentos: "+moves;
    var a=fl[0],b=fl[1];
    if(deck[a].k===deck[b].k){
      document.getElementById("m"+a).classList.add("ok");document.getElementById("m"+b).classList.add("ok");
      fl=[];done++;burst();
      if(done===C[cat].w.length){
        document.getElementById("msg").textContent="🎉 ¡Lo lograste en "+moves+" intentos! ¡Eres un campeón!";
        say("Great job!");
      }
    }else{
      lockM=true;
      setTimeout(function(){
        document.getElementById("m"+a).classList.remove("on");document.getElementById("m"+b).classList.remove("on");
        fl=[];lockM=false;
      },1000);
    }
  }
}
render();
</script>
</body></html>
